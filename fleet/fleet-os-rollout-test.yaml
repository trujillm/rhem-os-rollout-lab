# Test Fleet for OS image rollout lab. Rollout scripts set spec.template.spec.os.image to a digest-pinned ref.
apiVersion: flightctl.io/v1beta1
kind: Fleet
metadata:
  name: os-rollout-test
spec:
  selector:
    matchLabels:
      fleet: os-rollout-test
  template:
    metadata:
      labels:
        fleet: os-rollout-test
    spec:
      os:
        image: REPLACE_WITH_DIGEST_PINNED_REF
      applications: []
      config: []
      systemd:
        matchPatterns: []
